name: 通用问题反馈
description: 与学校无关的功能异常、界面问题或建议
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        如果是「其他学校能不能用」的反馈，请改用「跨校适配反馈」模板。

        **issue 公开可见**：不要粘贴手机号、学号、姓名、验证码、token/session；截图请先打码。
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 功能异常
        - 界面 / 显示
        - 功能建议
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 出现…
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望与实际结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 设备
      placeholder: 例如 1.0.2 · Android 14
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认没有粘贴任何个人信息或凭据
          required: true
